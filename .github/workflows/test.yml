name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
    
    - name: Run tests
      run: |
        make check
    
    - name: Test CLI on clean repo
      run: |
        python -m agent_hook_scan testdata/clean_repo
    
    - name: Test CLI on risky repo (should find issues)
      run: |
        python -m agent_hook_scan testdata/risky_mcp
    
    - name: Test SARIF output
      run: |
        python -m agent_hook_scan testdata/risky_mcp --sarif test-output.sarif
        test -f test-output.sarif
  
  # Dogfood the reusable action
  dogfood-action:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Scan testdata/risky_mcp with action (should fail)
      continue-on-error: true
      uses: ./
      with:
        path: testdata/risky_mcp
        fail-on: high
        sarif-path: risky-findings.sarif
    
    - name: Verify SARIF was created
      run: test -f risky-findings.sarif
    
    - name: Scan testdata/clean_repo with action (should pass)
      uses: ./
      with:
        path: testdata/clean_repo
        fail-on: high
