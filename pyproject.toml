[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hook-scan"
version = "0.1.0"
description = "Scan AI agent configs for risky hooks and over-broad tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Binh Phan", email = "bphansg@users.noreply.github.com"}
]
keywords = ["security", "linter", "ai", "agent", "cursor", "claude", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/bphansg/agent-hook-scan"
Repository = "https://github.com/bphansg/agent-hook-scan"
Issues = "https://github.com/bphansg/agent-hook-scan/issues"

[project.scripts]
agent-hook-scan = "agent_hook_scan.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
